upstream backend_sito {
    server web1:80 max_fails=1 fail_timeout=5s;
    server web2:80 backup;
}

upstream dns_monitor_api {
    server dns-monitor:5000;
}

upstream attendance_api {
    server attendance-api:5000;
}

server {
    listen 80;
    server_name _;

    location /api/dns-status {
        proxy_pass http://dns_monitor_api/api/dns-status;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location /api/presenze {
        proxy_pass http://attendance_api/api/presenze;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;

        client_max_body_size 32k;
    }

    location / {
        proxy_pass http://backend_sito;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;

        proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "load-balancer-ok\n";
    }
}
