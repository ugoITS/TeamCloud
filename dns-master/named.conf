options {
    directory "/var/cache/bind";

    recursion no;
    allow-query { any; };

    listen-on { any; };
    listen-on-v6 { none; };

    pid-file "/var/cache/bind/named.pid";
};

zone "teamcloud.test" {
    type primary;
    file "/etc/bind/db.teamcloud.test";

    allow-transfer {
        172.30.0.11;
    };

    also-notify {
        172.30.0.11;
    };

    notify yes;
};
